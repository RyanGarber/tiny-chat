name: check

on:
  push:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: paradedb/paradedb:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tiny_chat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tiny_chat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --shm-size=1g

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Cache Turbo
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-${{ runner.arch }}-turbo-check-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-turbo-check-

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Create cache key
        id: rust-toolchain
        run: echo "fingerprint=$(rustc -Vv | sha256sum | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/app/target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.fingerprint }}-cargo-check-${{ hashFiles('apps/app/**/Cargo.lock', 'apps/app/build.rs', 'apps/app/build_support/**', 'lib/afmize/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.fingerprint }}-cargo-check-${{ hashFiles('apps/app/**/Cargo.lock', 'apps/app/build.rs', 'apps/app/build_support/**', 'lib/afmize/Package.resolved') }}-
            ${{ runner.os }}-${{ runner.arch }}-${{ steps.rust-toolchain.outputs.fingerprint }}-cargo-check-

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Create .env
        run: |
          cat << EOF > .env
          PG_HOST=localhost
          PG_PORT=5432
          PG_USER=postgres
          PG_PASSWORD=postgres
          PG_DATABASE=tiny_chat
          VITE_SERVER_URL=http://localhost:8009
          VITE_SERVER_PORT=8009
          VITE_WEB_URL=http://localhost:8010
          VITE_WEB_PORT=8010
          DEV=true
          AUTH_GITHUB_CLIENT=dummy
          AUTH_GITHUB_SECRET=dummy
          AUTH_GOOGLE_CLIENT=dummy
          AUTH_GOOGLE_SECRET=dummy
          AUTH_HUGGINGFACE_CLIENT=dummy
          AUTH_HUGGINGFACE_SECRET=dummy
          EOF

      - name: Install dependencies
        run: CI_TESTING=true pnpm ci

      - name: Setup database
        run: pnpm --filter server exec prisma db migrate --yes

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Run tests
        timeout-minutes: 15
        run: |
          node --env-file=.env packages/server/src/server.ts &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          pnpm exec wait-on --timeout 60000 http://localhost:8009
          pnpm run test

      - name: Run smoketest
        run: pnpm run smoketest
        timeout-minutes: 15
