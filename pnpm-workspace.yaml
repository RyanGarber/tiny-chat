packages:
  - 'core/*'
  - 'apps/*'
allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  protobufjs: true
  sharp: true
  tesseract.js: true
allowedDeprecatedVersions:
  glob: "*"
  'node-domexception': "*"
  'whatwg-encoding': "*"
patchedDependencies:
  '@ai-sdk/google': patches/@ai-sdk__google.patch
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-react-hooks>eslint': '10'
