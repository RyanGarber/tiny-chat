packages:
    - 'apps/*'
    - 'packages/*'
allowBuilds:
    '@google/genai': true
    '@mongodb-js/zstd': true
    '@prisma/engines': true
    bun: true
    esbuild: true
    msgpackr-extract: true
    node-liblzma: true
    node-pty: true
    onnxruntime-node: true
    prisma: true
    protobufjs: true
    sharp: true
    tesseract.js: true
    tree-sitter-bash: true
    unrs-resolver: true
    workerd: true
allowedDeprecatedVersions:
    glob: '*'
    'node-domexception': '*'
    'whatwg-encoding': '*'
minimumReleaseAgeExclude:
    - '@ryangarber/*'
    - '@prisma/*'
    - '@turbo/linux-64@2.11.1 || 2.11.2'
    - '@turbo/darwin-64@2.11.2'
    - '@turbo/darwin-arm64@2.11.2'
    - '@turbo/linux-arm64@2.11.2'
    - '@turbo/windows-64@2.11.2'
    - '@turbo/windows-arm64@2.11.2'
    - turbo@2.11.2
peerDependencyRules:
    allowedVersions:
        '@browser-ai/web-llm>ai': '7'
        'capnp-es>typescript': '7'
        'alchemy>mysql2': '3'
        '@better-fetch/fetch': '1'
        'vitest': '5'
overrides:
    'conventional-changelog-writer': '^9.1.1'
    'effect': '4.0.0-rc.115'
patchedDependencies:
    '@ai-sdk/google': patches/@ai-sdk__google.patch
    sixel: patches/sixel.patch
