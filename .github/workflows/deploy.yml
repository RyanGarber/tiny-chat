name: deploy
on:
  workflow_call:
    inputs:
      version:
        description: "Version number to use for the release tag/name"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Version number to use for the release tag/name (defaults to tauri.conf.json)"
        required: false
        type: string

jobs:
  predeploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.version || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Create .env
        run: |
          cat << EOF > .env
          PG_HOST=${{ secrets.PG_HOST }}
          PG_PORT=${{ secrets.PG_PORT }}
          PG_USER=${{ secrets.PG_USER }}
          PG_PASSWORD=${{ secrets.PG_PASSWORD }}
          PG_DATABASE=${{ secrets.PG_DATABASE }}
          VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL }}
          VITE_SERVER_PORT=${{ secrets.VITE_SERVER_PORT }}
          VITE_WEB_URL=${{ secrets.VITE_WEB_URL }}
          VITE_WEB_PORT=${{ secrets.VITE_WEB_PORT }}
          AUTH_GITHUB_CLIENT=${{ secrets.AUTH_GITHUB_CLIENT }}
          AUTH_GITHUB_SECRET=${{ secrets.AUTH_GITHUB_SECRET }}
          AUTH_GOOGLE_CLIENT=${{ secrets.AUTH_GOOGLE_CLIENT }}
          AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_HUGGINGFACE_CLIENT=${{ secrets.AUTH_HUGGINGFACE_CLIENT }}
          AUTH_HUGGINGFACE_SECRET=${{ secrets.AUTH_HUGGINGFACE_SECRET }}
          EOF

      - name: Install dependencies
        run: pnpm ci

      - name: Prepare deployment
        run: |
          pnpm run build:gui
          cp -r packages/gui/dist apps/web/dist
          tar -czf deploy.tar.gz apps/web/dist

      - name: Upload deployment
        uses: actions/upload-artifact@v7
        with:
          name: deploy
          path: deploy.tar.gz

  deploy:
    runs-on: self-hosted
    needs: predeploy
    environment: production

    steps:
      - name: Checkout
        run: |
          rm -rf ~/deploy || true
          git clone https://github.com/ryangarber/tiny-chat.git ~/deploy --depth 1 --branch ${{ inputs.version || github.ref }}

      - name: Download deployment
        uses: actions/download-artifact@v8
        with:
          name: deploy

      - name: Extract deployment
        run: |
          tar -xzf deploy.tar.gz -C ~/deploy

      - name: Create .env
        run: |
          cd ~/deploy
          cat << EOF > .env
          PG_HOST=${{ secrets.PG_HOST }}
          PG_PORT=${{ secrets.PG_PORT }}
          PG_USER=${{ secrets.PG_USER }}
          PG_PASSWORD=${{ secrets.PG_PASSWORD }}
          PG_DATABASE=${{ secrets.PG_DATABASE }}
          VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL }}
          VITE_SERVER_PORT=${{ secrets.VITE_SERVER_PORT }}
          VITE_WEB_URL=${{ secrets.VITE_WEB_URL }}
          VITE_WEB_PORT=${{ secrets.VITE_WEB_PORT }}
          AUTH_GITHUB_CLIENT=${{ secrets.AUTH_GITHUB_CLIENT }}
          AUTH_GITHUB_SECRET=${{ secrets.AUTH_GITHUB_SECRET }}
          AUTH_GOOGLE_CLIENT=${{ secrets.AUTH_GOOGLE_CLIENT }}
          AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_HUGGINGFACE_CLIENT=${{ secrets.AUTH_HUGGINGFACE_CLIENT }}
          AUTH_HUGGINGFACE_SECRET=${{ secrets.AUTH_HUGGINGFACE_SECRET }}
          EOF

      - name: Install dependencies
        run: |
          cd ~/deploy
          pnpm ci

      - name: Activate deployment
        run: |
          cd ~/deploy/packages/server
          pm2 restart pm2.config.mjs --update-env || pm2 start pm2.config.mjs
          cd ~/deploy/apps/web
          pm2 restart pm2.config.mjs --update-env || pm2 start pm2.config.mjs
          pm2 save
