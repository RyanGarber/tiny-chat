name: ci-upgrade

on:
    push:
        branches:
            - ci/upgrade

jobs:
    build:
        name: ${{ matrix.name }}
        runs-on: xcode-27
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   name: macos
                        rust_targets: aarch64-apple-darwin
                    -   name: ios
                        rust_targets: aarch64-apple-ios
        environment: production

        steps:
            -   name: Checkout
                uses: actions/checkout@v7
                with:
                    submodules: recursive

            -   name: Install Rust
                uses: dtolnay/rust-toolchain@stable
                with:
                    targets: ${{ matrix.rust_targets }}
                    toolchain: stable
                    components: llvm-tools

            -   name: Check Apple toolchain
                id: toolchain
                run: |
                    xcodebuild -version
                    xcrun --sdk macosx --show-sdk-version
                    xcrun --sdk iphoneos --show-sdk-version
                    xcrun swift --version
                    rustc -Vv
                    fingerprint=$({
                      xcodebuild -version
                      xcrun --find swiftc
                      xcrun swift --version
                      rustc -Vv
                    } | shasum -a 256 | cut -d ' ' -f 1)
                    echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

            -   name: Cache Cargo
                uses: actions/cache@v4
                with:
                    path: |
                        ~/.cargo/registry
                        ~/.cargo/git
                        apps/tauri/target
                    key: ${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ matrix.name }}-cargo-v2-${{ hashFiles('apps/tauri/Cargo.lock', 'apps/tauri/build.rs', 'apps/tauri/build_support/**', 'apps/tauri/lib/afmize/Package.resolved') }}
                    restore-keys: ${{ runner.os }}-${{ runner.arch }}-${{ steps.toolchain.outputs.fingerprint }}-${{ matrix.name }}-cargo-v2-

            -   name: Cache Turbo
                uses: actions/cache@v4
                with:
                    path: .turbo
                    key: ${{ runner.os }}-turbo-${{ github.sha }}
                    restore-keys: ${{ runner.os }}-turbo-

            -   name: Install pnpm
                uses: pnpm/action-setup@v6

            -   name: Install Node
                uses: actions/setup-node@v7
                with:
                    node-version: lts/*
                    cache: pnpm

            -   name: Create .env
                shell: bash
                run: |
                    cat << EOF > .env
                    PG_HOST=${{ secrets.PG_HOST }}
                    PG_PORT=${{ secrets.PG_PORT }}
                    PG_USER=${{ secrets.PG_USER }}
                    PG_PASSWORD=${{ secrets.PG_PASSWORD }}
                    PG_DATABASE=${{ secrets.PG_DATABASE }}
                    VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL }}
                    VITE_SERVER_PORT=${{ secrets.VITE_SERVER_PORT }}
                    VITE_WEB_URL=${{ secrets.VITE_WEB_URL }}
                    VITE_WEB_PORT=${{ secrets.VITE_WEB_PORT }}
                    AUTH_GITHUB_CLIENT=${{ secrets.AUTH_GITHUB_CLIENT }}
                    AUTH_GITHUB_SECRET=${{ secrets.AUTH_GITHUB_SECRET }}
                    AUTH_GOOGLE_CLIENT=${{ secrets.AUTH_GOOGLE_CLIENT }}
                    AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
                    AUTH_HUGGINGFACE_CLIENT=${{ secrets.AUTH_HUGGINGFACE_CLIENT }}
                    AUTH_HUGGINGFACE_SECRET=${{ secrets.AUTH_HUGGINGFACE_SECRET }}
                    EOF

            -   name: Install dependencies
                run: pnpm ci

            -   name: Test Swift archive handling
                run: |
                    rustc --edition 2024 --test apps/tauri/build_support/swift_archive.rs -o "$RUNNER_TEMP/swift-archive-tests"
                    "$RUNNER_TEMP/swift-archive-tests" --include-ignored

            -   name: Build macOS
                if: matrix.name == 'macos'
                run: |
                    pnpm --filter @tiny-chat/tauri exec tauri build \
                      --features afm \
                      --target aarch64-apple-darwin \
                      --no-sign \
                      --ci \
                      -vv \
                      --config '{"bundle":{"createUpdaterArtifacts":false}}'

            -   name: Check macOS link
                if: matrix.name == 'macos'
                run: |
                    APP=$(find apps/tauri/target/aarch64-apple-darwin/release/bundle/macos -maxdepth 1 -name "*.app" | head -1)
                    EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")
                    BIN="$APP/Contents/MacOS/$EXEC"
                    echo "Binary: $BIN"
                    echo "=== load commands ==="
                    otool -L "$BIN"
                    echo "=== rpaths ==="
                    otool -l "$BIN" | awk '/LC_RPATH/{show=1} show && /path /{print; show=0}'
                    echo "=== afmize ==="
                    nm -gU "$BIN" | grep afmize || true
                    nm -gU "$BIN" | grep afmize_availability > /dev/null
                    otool -L "$BIN" | grep FoundationModels > /dev/null
                    otool -l "$BIN" | grep "lib/swift/macosx" > /dev/null

            -   name: Upload macOS artifact
                if: matrix.name == 'macos'
                uses: actions/upload-artifact@v5
                with:
                    name: tiny-chat-macos
                    retention-days: 14
                    if-no-files-found: error
                    path: apps/tauri/target/aarch64-apple-darwin/release/bundle

            -   name: Build iOS archive
                if: matrix.name == 'ios'
                run: bash scripts/build-ios-ci.sh

            -   name: Check iOS link
                if: matrix.name == 'ios'
                run: |
                    APP=$(find "$RUNNER_TEMP/tiny-chat_iOS.xcarchive/Products/Applications" -maxdepth 1 -name "*.app" | head -1)
                    EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
                    BIN="$APP/$EXEC"
                    echo "Binary: $BIN"
                    echo "=== load commands ==="
                    otool -L "$BIN"
                    echo "=== rpaths ==="
                    otool -l "$BIN" | awk '/LC_RPATH/{show=1} show && /path /{print; show=0}'
                    echo "=== afmize ==="
                    nm -gU "$BIN" | grep afmize || true
                    nm -gU "$BIN" | grep afmize_availability > /dev/null
                    otool -L "$BIN" | grep FoundationModels > /dev/null
                    # Device builds must not record the macOS toolchain slice.
                    if otool -l "$BIN" | grep "lib/swift/macosx" > /dev/null; then
                      echo "iOS binary has a macOS Swift rpath"
                      exit 1
                    fi
                    otool -L "$BIN" | grep "libswift" > /dev/null

            -   name: Package iOS
                if: matrix.name == 'ios'
                run: |
                    APP_PATH=$(find "$RUNNER_TEMP/tiny-chat_iOS.xcarchive/Products/Applications" \
                      -maxdepth 1 -name "*.app" | head -1)
                    echo "Packaging: $APP_PATH"
                    mkdir -p "$RUNNER_TEMP/Payload"
                    cp -r "$APP_PATH" "$RUNNER_TEMP/Payload/"
                    cd "$RUNNER_TEMP"
                    zip -9 -r "Tiny.Chat_iOS.ipa" Payload/
                    echo "IPA size: $(du -sh Tiny.Chat_iOS.ipa | cut -f1)"

            -   name: Upload iOS artifact
                if: matrix.name == 'ios'
                uses: actions/upload-artifact@v5
                with:
                    name: tiny-chat-ios
                    retention-days: 14
                    if-no-files-found: error
                    path: ${{ runner.temp }}/Tiny.Chat_iOS.ipa
