name: release

on:
  workflow_run:
    workflows:
      - check
    types:
      - completed
    # `dev` runs the whole release as a dry run: everything is built, and
    # nothing is published or deployed.
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build everything but publish nothing (always, off main)"
        required: false
        type: boolean
        default: false

concurrency:
  # Under workflow_run, github.ref is always the default branch.
  group: release-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  version:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.diff.outputs.released }}
      version: ${{ steps.diff.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
      dry_run: ${{ steps.mode.outputs.dry_run }}
      # What the release builds: its tag, or in a dry run (which tags
      # nothing) the commit.
      ref: ${{ steps.diff.outputs.ref }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm ci

      - name: Resolve mode
        id: mode
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          if [ "$BRANCH" != "main" ]; then DRY_RUN=true; fi
          {
            echo "dry_run=$DRY_RUN"
            echo "branch=$BRANCH"
            echo "sha=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Release from $BRANCH (dry run: $DRY_RUN)"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Read existing version
        id: before
        run: echo "version=$(node -pe "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Determine new version
        if: steps.mode.outputs.dry_run != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release

      # semantic-release works out the version and notes, then commits, tags
      # and pushes nothing; the version is written here as its `prepare` would
      # have. It reads the branch from GITHUB_REF, which workflow_run sets to
      # the default branch, and is told to release from this one.
      - name: Determine new version (dry run)
        if: steps.mode.outputs.dry_run == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.mode.outputs.branch }}
        run: |
          GITHUB_REF="refs/heads/$BRANCH" pnpm exec semantic-release \
            --dry-run --branches "$BRANCH" | tee "$RUNNER_TEMP/semantic-release.log"
          NEXT=$(sed -n 's/.*The next release version is \([^ ]*\).*/\1/p' "$RUNNER_TEMP/semantic-release.log" | tail -1)
          if [ -n "$NEXT" ]; then
            node scripts/write-version.ts "$NEXT"
          else
            echo "No release-worthy commits; the dry run uses the current version"
            printf 'Dry run of %s: no release-worthy commits.\n' "$(git rev-parse --short HEAD)" > CHANGES.md
          fi

      - name: Write release status
        id: diff
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
          SHA: ${{ steps.mode.outputs.sha }}
        run: |
          VERSION=$(node -pe "require('./package.json').version")
          # A dry run goes through every time, so each push to dev tests it.
          if [ "$DRY_RUN" = "true" ] || [ "$VERSION" != "${{ steps.before.outputs.version }}" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$DRY_RUN" = "true" ]; then
            echo "ref=$SHA" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        id: notes
        run: |
          DELIMITER="EOF_$(uuidgen)"
          {
            echo "notes<<$DELIMITER"
            cat CHANGES.md 2>/dev/null || true
            echo "$DELIMITER"
          } >> "$GITHUB_OUTPUT"

  create-release:
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This job has no checkout, so gh cannot infer the repo from a git
          # remote. GH_REPO tells it explicitly (avoids "not a git repository").
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          NOTES: ${{ needs.version.outputs.notes }}
          DRY_RUN: ${{ needs.version.outputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            {
              echo "### Dry run: $VERSION"
              echo
              echo "Would create release \`$VERSION\` of \`$GH_REPO\` with these notes:"
              echo
              printf '%s\n' "$NOTES"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
            exit 0
          fi
          NOTES_FILE=$(mktemp)
          printf '%s' "$NOTES" > "$NOTES_FILE"
          # No --verify-tag: it shells out to local git, which isn't present
          # here. The tag was already pushed by semantic-release in the version
          # job, so we don't need to re-verify it.
          if ! gh release create "$VERSION" \
              --title "$VERSION" \
              --notes-file "$NOTES_FILE"; then
            gh release view "$VERSION" >/dev/null 2>&1 \
              || { echo "Failed to create or find release $VERSION"; exit 1; }
            echo "Release $VERSION already exists, continuing"
          fi

  desktop:
    needs: [version, create-release]
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.version.outputs.version }}
      notes: ${{ needs.version.outputs.notes }}
      ref: ${{ needs.version.outputs.ref }}
      dry_run: ${{ needs.version.outputs.dry_run == 'true' }}
    secrets: inherit

  android:
    needs: [version, create-release]
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/release-android.yml
    with:
      version: ${{ needs.version.outputs.version }}
      notes: ${{ needs.version.outputs.notes }}
      ref: ${{ needs.version.outputs.ref }}
      dry_run: ${{ needs.version.outputs.dry_run == 'true' }}
    secrets: inherit

  ios:
    needs: [version, create-release]
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/release-ios.yml
    with:
      version: ${{ needs.version.outputs.version }}
      notes: ${{ needs.version.outputs.notes }}
      ref: ${{ needs.version.outputs.ref }}
      dry_run: ${{ needs.version.outputs.dry_run == 'true' }}
    secrets: inherit

  cli:
    needs: [version, create-release]
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/release-cli.yml
    with:
      version: ${{ needs.version.outputs.version }}
      notes: ${{ needs.version.outputs.notes }}
      ref: ${{ needs.version.outputs.ref }}
      dry_run: ${{ needs.version.outputs.dry_run == 'true' }}
    secrets: inherit

  deploy:
    needs: version
    if: needs.version.outputs.released == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      version: ${{ needs.version.outputs.version }}
      ref: ${{ needs.version.outputs.ref }}
      dry_run: ${{ needs.version.outputs.dry_run == 'true' }}
    secrets: inherit
