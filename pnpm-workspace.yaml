packages:
    - 'apps/*'
    - 'packages/*'
allowBuilds:
    '@google/genai': true
    '@mongodb-js/zstd': true
    '@prisma/engines': true
    bun: true
    esbuild: true
    msgpackr-extract: true
    node-liblzma: true
    node-pty: true
    onnxruntime-node: true
    prisma: true
    protobufjs: true
    sharp: true
    tesseract.js: true
    tree-sitter-bash: true
    unrs-resolver: true
    workerd: true
allowedDeprecatedVersions:
    glob: '*'
    'node-domexception': '*'
    'whatwg-encoding': '*'
minimumReleaseAgeExclude:
    - diff@8.0.3
    - '@tootallnate/once@3.0.1'
    - '@hono/node-server@1.19.13'
    - '@opentelemetry/sdk-node@0.217.0'
    - '@opentelemetry/exporter-prometheus@0.217.0'
    - '@ryangarber/markitdown-ts@0.1.5'
peerDependencyRules:
    allowedVersions:
        '@browser-ai/web-llm>ai': '7'
        'capnp-es>typescript': '7'
        'alchemy>mysql2': '3'
overrides:
    'conventional-changelog-writer': '^9.1.1'
patchedDependencies:
    '@ai-sdk/google': patches/@ai-sdk__google.patch
    sixel: patches/sixel.patch
