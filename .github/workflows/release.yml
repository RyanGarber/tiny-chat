name: release

on:
    workflow_run:
        workflows:
            - check
        types:
            - completed
        branches:
            - main
    workflow_dispatch:

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    version:
        if: >-
            github.event_name == 'workflow_dispatch' ||
            (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push')
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            released: ${{ steps.diff.outputs.released }}
            version: ${{ steps.diff.outputs.version }}
            notes: ${{ steps.notes.outputs.notes }}

        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
                    fetch-depth: 0
                    persist-credentials: true

            -   name: Install pnpm
                uses: pnpm/action-setup@v6

            -   name: Install Node
                uses: actions/setup-node@v6
                with:
                    node-version: lts/*
                    cache: pnpm

            -   name: Install dependencies
                run: pnpm ci

            -   name: Configure git
                run: |
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            -   name: Read existing version
                id: before
                run: echo "version=$(node -pe "require('./apps/tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"

            -   name: Determine new version
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                run: pnpm exec semantic-release

            -   name: Write release status
                id: diff
                run: |
                    VERSION=$(node -pe "require('./apps/tauri/tauri.conf.json').version")
                    if [ "$VERSION" != "${{ steps.before.outputs.version }}" ]; then
                      echo "released=true" >> "$GITHUB_OUTPUT"
                    else
                      echo "released=false" >> "$GITHUB_OUTPUT"
                    fi
                    echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            -   name: Write release notes
                id: notes
                run: |
                    DELIMITER="EOF_$(uuidgen)"
                    {
                      echo "notes<<$DELIMITER"
                      cat CHANGES.md 2>/dev/null || true
                      echo "$DELIMITER"
                    } >> "$GITHUB_OUTPUT"

    create-release:
        needs: version
        if: needs.version.outputs.released == 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   name: Create GitHub release
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    # This job has no checkout, so gh cannot infer the repo from a git
                    # remote. GH_REPO tells it explicitly (avoids "not a git repository").
                    GH_REPO: ${{ github.repository }}
                    VERSION: ${{ needs.version.outputs.version }}
                    NOTES: ${{ needs.version.outputs.notes }}
                run: |
                    if gh release view "$VERSION" >/dev/null 2>&1; then
                      echo "Release $VERSION already exists"
                      exit 0
                    fi
                    NOTES_FILE=$(mktemp)
                    printf '%s' "$NOTES" > "$NOTES_FILE"
                    # No --verify-tag: it shells out to local git, which isn't present
                    # here. The tag was already pushed by semantic-release in the version
                    # job, so we don't need to re-verify it.
                    if ! gh release create "$VERSION" \
                        --title "$VERSION" \
                        --notes-file "$NOTES_FILE"; then
                      gh release view "$VERSION" >/dev/null 2>&1 \
                        || { echo "Failed to create or find release $VERSION"; exit 1; }
                      echo "Release $VERSION already exists, continuing"
                    fi

    desktop:
        needs: [ version, create-release ]
        if: needs.version.outputs.released == 'true'
        uses: ./.github/workflows/release-desktop.yml
        with:
            version: ${{ needs.version.outputs.version }}
            notes: ${{ needs.version.outputs.notes }}
        secrets: inherit

    android:
        needs: [ version, create-release ]
        if: needs.version.outputs.released == 'true'
        uses: ./.github/workflows/release-android.yml
        with:
            version: ${{ needs.version.outputs.version }}
            notes: ${{ needs.version.outputs.notes }}
        secrets: inherit

    ios:
        needs: [ version, create-release ]
        if: needs.version.outputs.released == 'true'
        uses: ./.github/workflows/release-ios.yml
        with:
            version: ${{ needs.version.outputs.version }}
            notes: ${{ needs.version.outputs.notes }}
        secrets: inherit

    cli:
        needs: [ version, create-release ]
        if: needs.version.outputs.released == 'true'
        uses: ./.github/workflows/release-cli.yml
        with:
            version: ${{ needs.version.outputs.version }}
            notes: ${{ needs.version.outputs.notes }}
        secrets: inherit

    deploy:
        needs: version
        if: needs.version.outputs.released == 'true'
        uses: ./.github/workflows/deploy.yml
        with:
            version: ${{ needs.version.outputs.version }}
        secrets: inherit
