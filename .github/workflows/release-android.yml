name: release-android

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install system
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager "ndk;30.0.14904198"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
          toolchain: stable

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Create .env
        run: |
          cat << EOF > .env
          PG_HOST=${{ secrets.PG_HOST }}
          PG_PORT=${{ secrets.PG_PORT }}
          PG_USER=${{ secrets.PG_USER }}
          PG_PASSWORD=${{ secrets.PG_PASSWORD }}
          PG_DATABASE=${{ secrets.PG_DATABASE }}
          VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}
          VITE_BACKEND_PORT=${{ secrets.VITE_BACKEND_PORT }}
          VITE_BACKEND_PATH_TRPC=${{ secrets.VITE_BACKEND_PATH_TRPC }}
          VITE_BACKEND_PATH_AUTH=${{ secrets.VITE_BACKEND_PATH_AUTH }}
          VITE_WEB_URL=${{ secrets.VITE_WEB_URL }}
          VITE_WEB_PORT=${{ secrets.VITE_WEB_PORT }}
          AUTH_GITHUB_CLIENT=${{ secrets.AUTH_GITHUB_CLIENT }}
          AUTH_GITHUB_SECRET=${{ secrets.AUTH_GITHUB_SECRET }}
          AUTH_GOOGLE_CLIENT=${{ secrets.AUTH_GOOGLE_CLIENT }}
          AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
          AUTH_HUGGINGFACE_CLIENT=${{ secrets.AUTH_HUGGINGFACE_CLIENT }}
          AUTH_HUGGINGFACE_SECRET=${{ secrets.AUTH_HUGGINGFACE_SECRET }}
          EOF

      - name: Install packages
        run: pnpm install --frozen-lockfile

      - name: Build project
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.14904198
        run: pnpm --filter @tiny-chat/tauri run tauri android build --apk --split-per-abi

      - name: Package APKs
        run: |
          APK_DIR="apps/tauri/gen/android/app/build/outputs/apk"
          OUTPUT="$RUNNER_TEMP/Tiny.Chat_Android.zip"
          find "$APK_DIR" -name "*-unsigned.apk" | while read apk; do
            echo "Found: $apk"
          done
          zip -9 -j "$OUTPUT" $(find "$APK_DIR" -name "*-unsigned.apk")
          echo "Archive size: $(du -sh "$OUTPUT" | cut -f1)"

      - name: Generate tag
        id: tag
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.sha_short }}
          name: ${{ steps.tag.outputs.sha_short }}
          body: Download for Windows, macOS, or Linux, or sideload to your iOS or Android device.
          files: ${{ runner.temp }}/Tiny.Chat_Android.zip
          fail_on_unmatched_files: true
