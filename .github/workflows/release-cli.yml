name: release-cli

on:
    workflow_call:
        inputs:
            version:
                description: 'Version number to use for the release tag/name'
                required: true
                type: string
            notes:
                description: 'Release notes/changelog to include in the release body'
                required: false
                type: string
    workflow_dispatch:
        inputs:
            version:
                description: 'Version number to use for the release tag/name (defaults to tauri.conf.json)'
                required: false
                type: string
            notes:
                description: 'Release notes/changelog to include in the release body'
                required: false
                type: string

jobs:
    release:
        permissions:
            contents: write
        strategy:
            fail-fast: false
            matrix:
                include:
                    -   platform: 'macos-latest'
                        asset: 'Tiny.Chat_CLI_macOS'
                    -   platform: 'ubuntu-latest'
                        asset: 'Tiny.Chat_CLI_Linux'
                    -   platform: 'windows-latest'
                        asset: 'Tiny.Chat_CLI_Windows.exe'

        runs-on: ${{ matrix.platform }}
        environment: production

        steps:
            -   name: Checkout
                uses: actions/checkout@v6
                with:
                    ref: ${{ inputs.version || github.ref }}

            -   name: Install pnpm
                uses: pnpm/action-setup@v6

            -   name: Install Node
                uses: actions/setup-node@v6
                with:
                    node-version: lts/*
                    cache: pnpm

            -   name: Create .env
                shell: bash
                run: |
                    cat << EOF > .env
                    PG_HOST=${{ secrets.PG_HOST }}
                    PG_PORT=${{ secrets.PG_PORT }}
                    PG_USER=${{ secrets.PG_USER }}
                    PG_PASSWORD=${{ secrets.PG_PASSWORD }}
                    PG_DATABASE=${{ secrets.PG_DATABASE }}
                    VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL }}
                    VITE_SERVER_PORT=${{ secrets.VITE_SERVER_PORT }}
                    VITE_WEB_URL=${{ secrets.VITE_WEB_URL }}
                    VITE_WEB_PORT=${{ secrets.VITE_WEB_PORT }}
                    AUTH_GITHUB_CLIENT=${{ secrets.AUTH_GITHUB_CLIENT }}
                    AUTH_GITHUB_SECRET=${{ secrets.AUTH_GITHUB_SECRET }}
                    AUTH_GOOGLE_CLIENT=${{ secrets.AUTH_GOOGLE_CLIENT }}
                    AUTH_GOOGLE_SECRET=${{ secrets.AUTH_GOOGLE_SECRET }}
                    AUTH_HUGGINGFACE_CLIENT=${{ secrets.AUTH_HUGGINGFACE_CLIENT }}
                    AUTH_HUGGINGFACE_SECRET=${{ secrets.AUTH_HUGGINGFACE_SECRET }}
                    EOF

            -   name: Install dependencies
                run: pnpm ci

            -   name: Build CLI
                run: pnpm run build:cli

            -   name: Package binary
                shell: bash
                run: |
                    BIN=$(find apps/cli/dist -maxdepth 1 -name "tiny-chat*" -type f | head -1)
                    echo "Found: $BIN"
                    cp "$BIN" "$RUNNER_TEMP/${{ matrix.asset }}"

            -   name: Resolve version
                shell: bash
                id: version
                run: |
                    VERSION="${{ inputs.version }}"
                    if [ -z "$VERSION" ]; then
                      VERSION=$(node -pe "require('./apps/tauri/tauri.conf.json').version")
                    fi
                    echo "version=$VERSION" >> $GITHUB_OUTPUT

            -   name: Upload release asset
                shell: bash
                env:
                    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    GH_REPO: ${{ github.repository }}
                    VERSION: ${{ steps.version.outputs.version }}
                    NOTES: ${{ inputs.notes }}
                run: |
                    # Ensure a published release exists. Create is best-effort: another
                    # job (desktop/create-release) may win the race; treat that as success.
                    if ! gh release view "$VERSION" >/dev/null 2>&1; then
                      NOTES_FILE=$(mktemp)
                      printf '%s' "$NOTES" > "$NOTES_FILE"
                      if ! gh release create "$VERSION" \
                          --title "$VERSION" \
                          --notes-file "$NOTES_FILE"; then
                        gh release view "$VERSION" >/dev/null 2>&1 \
                          || { echo "Failed to create or find release $VERSION"; exit 1; }
                        echo "Release $VERSION already exists (create race), continuing"
                      fi
                    fi

                    # Brief wait for API visibility after a concurrent create.
                    for attempt in 1 2 3 4 5; do
                      gh release view "$VERSION" >/dev/null 2>&1 && break
                      if [ "$attempt" -eq 5 ]; then
                        echo "Release $VERSION not visible after waiting"
                        exit 1
                      fi
                      sleep "$attempt"
                    done

                    gh release upload "$VERSION" "$RUNNER_TEMP/${{ matrix.asset }}" --clobber
